name: End-to-End Automated Testing (Playwright)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run Playwright E2E Test Suite
    timeout-minutes: 20
    runs-on: ubuntu-latest

    env:
      CI: true
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      VITE_UPI_MERCHANT_VPA: ${{ secrets.VITE_UPI_MERCHANT_VPA }}
      VITE_UPI_MERCHANT_NAME: ${{ secrets.VITE_UPI_MERCHANT_NAME }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps

      - name: Validate Environment & Build Production Assets
        run: npm run build

      - name: Execute Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
