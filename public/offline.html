<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendorSaathi — Offline Mode</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f0fdf4;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #bbf7d0;
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(5, 150, 105, 0.15);
    }
    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #ecfdf5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 20px;
      border: 1.5px solid #a7f3d0;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #064e3b;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(5, 150, 105, 0.3);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.4);
    }
    .status {
      font-size: 12px;
      color: #059669;
      font-weight: 700;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">📶</div>
    <h1>You're Currently Offline</h1>
    <p>VendorSaathi needs an internet connection to sync live vendor inventory and prices. Please check your data connection or Wi-Fi.</p>
    <button class="btn" onclick="window.location.reload()">
      <span>🔄 Retry Connection</span>
    </button>
    <div class="status">⚡ VendorSaathi Progressive Web App</div>
  </div>
</body>
</html>
