<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded App Tile -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Main Emblem Group -->
  <g filter="url(#glow192)" transform="translate(24, 24)">
    <!-- Shopping Basket Body -->
    <path d="M22 52 H122 L112 110 C110 120 102 128 92 128 H52 C42 128 34 120 32 110 Z" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Basket Handle -->
    <path d="M42 52 C42 22 102 22 102 52" fill="none" stroke="url(#goldGrad192)" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Basket Grid Lines -->
    <path d="M44 68 H100 M48 88 H96 M54 108 H90" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Fresh Sprout / Leaf on Basket -->
    <path d="M72 16 C88 16 94 32 72 40 C54 32 60 16 72 16 Z" fill="#10b981"/>
    <path d="M72 40 C72 26 80 20 86 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sparkle Accent -->
    <path d="M116 26 L120 34 L128 38 L120 42 L116 50 L112 42 L104 38 L112 34 Z" fill="url(#goldGrad192)"/>
  </g>
</svg>
